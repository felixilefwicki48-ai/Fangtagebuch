<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fangtagebuch</title>
<style>
:root{--bg:#e8eeed;--card:#f7faf9;--ink:#10292b;--mute:#5b7173;--line:#c5d3d2;--water:#1f6f78;--float:#c4762a;--bar:#9cc3c6}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a1c;--card:#14272a;--ink:#e3eeed;--mute:#8fa8aa;--line:#264144;--water:#5fb4bd;--float:#e09a50;--bar:#2c5a60}}
*{box-sizing:border-box}
[hidden]{display:none!important}
button:disabled{opacity:.5;cursor:default}
.lbl{font-size:.85rem;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font-size:.9rem;cursor:pointer}
.chip input{width:auto;margin:0}
.chip:has(input:checked){background:var(--water);border-color:var(--water);color:#fff}
@media(prefers-color-scheme:dark){.chip:has(input:checked){color:#08181a}}
.hint{font-size:.85rem;color:var(--mute)}
.add{display:flex;gap:6px;margin-top:6px}
.add input{flex:1;margin:0}
.add button{padding:6px 12px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:28px 20px 8px;max-width:1100px;margin:0 auto}
h1{font:700 2rem/1.1 Georgia,'Times New Roman',serif;margin:0}
h1 span{color:var(--float)}
header p{margin:6px 0 0;color:var(--mute)}
main{max-width:1100px;margin:0 auto;padding:12px 20px 60px;display:grid;gap:20px;grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font:700 1.2rem Georgia,serif;margin:0 0 12px}
h3{font-size:.95rem;margin:18px 0 8px;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mute)}
input,select,textarea{width:100%;margin-top:3px;padding:9px 10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--water);outline-offset:1px}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.95rem}
.chk input{width:auto;margin:0}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px}
button.main{background:var(--water);border-color:var(--water);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){button.main{color:#08181a}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:6px}
.stat{border-left:3px solid var(--float);padding-left:10px}
.stat b{display:block;font:700 1.6rem Georgia,serif}
.stat small{color:var(--mute)}
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:90px 1fr minmax(70px,auto);gap:8px;align-items:center;font-size:.9rem}
.bar .t{height:14px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--bar);border-right:3px solid var(--water)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar span:last-child{text-align:right;color:var(--mute);white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:0 24px}
.entry{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry strong{font-size:1.05rem}
.entry .len{font:700 1.3rem Georgia,serif;color:var(--water)}
.entry .meta{grid-column:1/-1;color:var(--mute);font-size:.88rem}
.entry .act{grid-column:1/-1}
.entry .act button{padding:3px 10px;font-size:.82rem;margin-right:6px}
.empty{color:var(--mute);padding:10px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Fangtagebuch<span>.</span></h1>
  <p>Deine Fänge, Köder und Zeiten an einem Ort.</p>
</header>
<main>
  <section>
    <h2 id="formTitle">Neuer Fang</h2>
    <form id="f" autocomplete="off">
      <div class="grid">
        <label class="chk full"><input type="checkbox" id="kein"> Kein Fang (Schneidertag)</label>
        <label>Datum<input type="date" id="datum" required></label>
        <label>Uhrzeit<input type="time" id="zeit" required></label>
        <label class="full c">Fisch<input id="fisch" list="dlFisch" placeholder="z. B. Hecht" required></label>
        <label class="c">Länge (cm)<input type="number" id="laenge" min="1" max="300" step="0.5" required></label>
        <label class="c">Gewicht (kg)<input type="number" id="gewicht" min="0" step="0.01"></label>
        <div class="full"><span class="lbl">Köder (Mehrfachauswahl)</span><div class="chips" id="koeder"></div>
          <div class="add"><input id="koederNeu" placeholder="Neuer Köder"><button type="button" data-add="koeder">Hinzufügen</button></div></div>
        <div class="full"><span class="lbl">Gewässer (Mehrfachauswahl)</span><div class="chips" id="gewaesser"></div>
          <div class="add"><input id="gewaesserNeu" placeholder="Neues Gewässer"><button type="button" data-add="gewaesser">Hinzufügen</button></div></div>
        <div class="full"><span class="lbl">Methode (Mehrfachauswahl)</span><div class="chips" id="methode"></div>
          <div class="add"><input id="methodeNeu" placeholder="Neue Methode"><button type="button" data-add="methode">Hinzufügen</button></div></div>
        <div class="full"><span class="lbl">Wetter (Mehrfachauswahl)</span><div class="chips" id="wetter"></div>
          <div class="add"><input id="wetterNeu" placeholder="Neues Wetter"><button type="button" data-add="wetter">Hinzufügen</button></div></div>
        <label>Wassertemp. (°C)<input type="number" id="wtemp" step="0.5"></label>
        <label class="full">Notiz<textarea id="notiz" rows="2" placeholder="Tiefe, Stelle, Besonderheiten …"></textarea></label>
        <label class="chk full c"><input type="checkbox" id="frei" checked> Zurückgesetzt</label>
      </div>
      <div class="row">
        <button class="main" type="submit" id="saveBtn">Fang speichern</button>
        <button type="button" id="cancelBtn" hidden>Abbrechen</button>
      </div>
    </form>
    <datalist id="dlFisch"></datalist>
    <h3>Daten sichern</h3>
    <p style="font-size:.85rem;color:var(--mute);margin:0 0 8px">Die Einträge liegen nur in diesem Browser. Sichere sie regelmäßig als Datei.</p>
    <div class="row" style="margin-top:0">
      <button type="button" id="expJson">Sichern (JSON)</button>
      <button type="button" id="expCsv">CSV</button>
      <button type="button" id="impBtn">Laden</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
  </section>

  <div style="display:grid;gap:20px;min-width:0">
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h2 style="margin:0">Statistik</h2><button type="button" id="pdfBtn">Als PDF</button></div>
      <div id="stats"></div>
    </section>
    <section>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px"><h2 style="margin:0">Fänge</h2><button type="button" id="listPdfBtn">Als PDF</button></div>
      <div id="list"></div>
    </section>
  </div>
</main>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY='fangtagebuch.v1';
const BASE={koeder:[],gewaesser:[],methode:[],wetter:[]};
let dtTouched=false;
const AUSBLENDEN={gewaesser:['kanal']};
const FIELDS=Object.keys(BASE);
const wl=v=>Array.isArray(v)?v:(v?[v]:[]);
const $=id=>document.getElementById(id);
let data=load(), editId=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));return Array.isArray(d)?d:[]}catch(e){return[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){toast('Speichern im Browser nicht möglich')}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n,d=1){return n.toLocaleString('de-DE',{maximumFractionDigits:d})}
function today(){return new Date().toLocaleDateString('sv')}
function now(){return new Date().toTimeString().slice(0,5)}
function dDE(s){const[y,m,d]=s.split('-');return `${d}.${m}.${y}`}

function setMode(){
  const k=$('kein').checked;
  document.querySelectorAll('.c').forEach(x=>x.hidden=k);
  ['fisch','laenge'].forEach(id=>$(id).required=!k);
  $('formTitle').textContent=editId?'Eintrag bearbeiten':(k?'Angeltag ohne Fang':'Neuer Fang');
  $('saveBtn').textContent=editId?'Änderung speichern':(k?'Tag speichern':'Fang speichern');
}
function resetForm(){
  $('f').reset(); editId=null;
  $('datum').value=today(); $('zeit').value=now(); dtTouched=false; $('frei').checked=true;
  $('cancelBtn').hidden=true; setMode();
  const last=sorted()[0]; FIELDS.forEach(k=>{$(k+'Neu').value='';renderChips(k,k==='gewaesser'&&last?wl(last.gewaesser):[])});
}
const uniqCI=arr=>{const seen=new Set();return arr.filter(v=>{const k=v.toLowerCase();if(seen.has(k))return false;seen.add(k);return true})};
const getChips=k=>[...document.querySelectorAll(`#${k} input:checked`)].map(i=>i.value);
function renderChips(k,selected){
  const sel=selected||getChips(k);
  const cnt={};data.forEach(e=>wl(e[k]).forEach(v=>cnt[v]=(cnt[v]||0)+1));
  const hide=AUSBLENDEN[k]||[];
  const hist=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).filter(v=>!hide.includes(v.toLowerCase()));
  const list=uniqCI([...BASE[k],...hist,...sel]);
  $(k).innerHTML=list.length?list.map(v=>`<label class="chip"><input type="checkbox" value="${esc(v)}"${sel.includes(v)?' checked':''}>${esc(v)}</label>`).join(''):'<span class="hint">Noch keine Einträge – unten hinzufügen</span>';
}
function addChip(k){
  const inp=$(k+'Neu'),v=inp.value.trim(); if(!v)return;
  const sel=getChips(k);
  const ex=[...document.querySelectorAll(`#${k} input`)].map(i=>i.value).find(x=>x.toLowerCase()===v.toLowerCase());
  const val=ex||v; if(!sel.includes(val))sel.push(val);
  inp.value='';renderChips(k,sel);
}
function opts(){
  const f={};data.forEach(e=>{if(e.fisch)f[e.fisch]=(f[e.fisch]||0)+1});
  $('dlFisch').innerHTML=uniqCI(Object.keys(f).sort((a,b)=>f[b]-f[a])).map(v=>`<option value="${esc(v)}">`).join('');
  FIELDS.forEach(k=>renderChips(k));
}
const sorted=()=>[...data].sort((a,b)=>(b.datum+b.zeit).localeCompare(a.datum+a.zeit));

$('f').addEventListener('submit',ev=>{
  ev.preventDefault();
  FIELDS.forEach(k=>addChip(k));
  const e={id:editId||Date.now().toString(36),datum:$('datum').value,zeit:$('zeit').value,fisch:$('fisch').value.trim(),
    laenge:parseFloat($('laenge').value),gewicht:parseFloat($('gewicht').value)||null,koeder:getChips('koeder'),
    gewaesser:getChips('gewaesser'),methode:getChips('methode'),wetter:getChips('wetter'),
    wtemp:$('wtemp').value===''?null:parseFloat($('wtemp').value),notiz:$('notiz').value.trim(),frei:$('frei').checked};
  if($('kein').checked){e.kein=true;e.fisch='';e.laenge=0;e.gewicht=null;e.frei=false}else if(!e.koeder.length){toast('Bitte einen Köder wählen oder eintragen');return}
  if(editId){data=data.map(x=>x.id===editId?e:x)}else{data.push(e)}
  save(); toast(editId?'Eintrag geändert':'Eintrag gespeichert'); resetForm(); render();
});
$('cancelBtn').onclick=resetForm;
['datum','zeit'].forEach(id=>$(id).addEventListener('input',()=>{dtTouched=true}));
function stampNow(){if(dtTouched||editId)return;$('datum').value=today();$('zeit').value=now()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)stampNow()});
window.addEventListener('focus',stampNow);
setInterval(stampNow,30000);
$('kein').addEventListener('change',setMode);
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addChip(b.dataset.add));
FIELDS.forEach(k=>$(k+'Neu').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addChip(k)}}));

function setChips_(e){FIELDS.forEach(k=>renderChips(k,wl(e[k])))}
function edit(id){
  const e=data.find(x=>x.id===id); if(!e)return; editId=id;
  $('datum').value=e.datum;$('zeit').value=e.zeit;$('fisch').value=e.fisch;$('laenge').value=e.laenge;
  $('gewicht').value=e.gewicht??'';setChips_(e);
  $('wtemp').value=e.wtemp??'';
  $('notiz').value=e.notiz||'';$('frei').checked=!!e.frei;
  $('kein').checked=!!e.kein;$('cancelBtn').hidden=false;setMode();
  window.scrollTo({top:0,behavior:'smooth'});
}
function del(id){
  const e=data.find(x=>x.id===id); if(!e)return;
  if(!confirm(`${e.kein?'Eintrag ohne Fang':e.fisch} vom ${dDE(e.datum)} löschen?`))return;
  data=data.filter(x=>x.id!==id); save(); if(editId===id)resetForm(); render(); toast('Gelöscht');
}

function bars(rows,unit){
  if(!rows.length)return'<div class="empty">Noch keine Daten.</div>';
  const max=Math.max(...rows.map(r=>r.v),1);
  return `<div class="bars">${rows.map(r=>`<div class="bar"><span title="${esc(r.l)}">${esc(r.l)}</span><span class="t"><i style="width:${r.v/max*100}%"></i></span><span>${r.txt??r.v+unit}</span></div>`).join('')}</div>`;
}
function count(arr,fn){const m={};arr.forEach(e=>{const k=fn(e);if(k)m[k]=(m[k]||0)+1});return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)}
function bucket(t){const h=+t.slice(0,2);return h>=4&&h<10?'Morgen (4–10)':h>=10&&h<16?'Tag (10–16)':h>=16&&h<22?'Abend (16–22)':'Nacht (22–4)'}
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

function countM(arr,key){const m={};arr.forEach(e=>wl(e[key]).forEach(k=>m[k]=(m[k]||0)+1));return Object.entries(m).map(([l,v])=>({l,v})).sort((a,b)=>b.v-a.v)}
function buildStats(){
  if(!data.length)return null;
  const c=data.filter(e=>!e.kein), n=c.length;
  const days=new Set(data.map(e=>e.datum)).size, ok=new Set(c.map(e=>e.datum)).size;
  const kpis=[[days,'Angeltage'],[Math.round(ok/days*100)+' %',`mit Fang (${ok} von ${days})`],[days-ok,'ohne Fang'],[n,'Fänge']];
  const sec=[];
  if(n){
    const avg=c.reduce((s,e)=>s+e.laenge,0)/n, big=c.reduce((a,b)=>b.laenge>a.laenge?b:a);
    kpis.push([fmt(n/days),'Fänge pro Angeltag'],[fmt(avg)+' cm','Ø Länge'],[fmt(big.laenge)+' cm','Größter: '+big.fisch]);
    const rec=count(c,e=>e.fisch).slice(0,8).map(r=>({l:r.l,v:r.v,txt:`${r.v}× · max ${fmt(Math.max(...c.filter(e=>e.fisch===r.l).map(e=>e.laenge)),0)}`}));
    const bt=countM(c,'koeder').slice(0,8).map(r=>({...r,txt:`${r.v}×`}));
    const tb=['Morgen (4–10)','Tag (10–16)','Abend (16–22)','Nacht (22–4)'].map(l=>{const v=c.filter(e=>bucket(e.zeit)===l).length;return{l,v,txt:`${v}×`}});
    sec.push({t:'Fische (Anzahl · größter in cm)',rows:rec},{t:'Beste Köder',rows:bt},{t:'Tageszeit der Fänge',rows:tb});
  }
  const mm={};
  data.forEach(e=>{const k=e.datum.slice(0,7);const o=mm[k]=mm[k]||{all:new Set(),ok:new Set()};o.all.add(e.datum);if(!e.kein)o.ok.add(e.datum)});
  sec.push({t:'Monate (Tage mit Fang)',rows:Object.keys(mm).sort().slice(-12).map(k=>({l:MON[+k.slice(5)-1]+' '+k.slice(2,4),v:mm[k].all.size,txt:`${mm[k].ok.size} von ${mm[k].all.size} Tagen`}))});
  const split=key=>{const m={};data.forEach(e=>wl(e[key]).forEach(k=>{const o=m[k]=m[k]||{k:0,b:0};if(e.kein)o.b++;else o.k++}));
    return Object.entries(m).map(([l,o])=>({l,v:o.k+o.b,txt:`${o.k} Fänge · ${o.b}× ohne`})).sort((a,b)=>b.v-a.v).slice(0,6)};
  [['Gewässer','gewaesser'],['Methode','methode'],['Wetter','wetter']].forEach(([t,k])=>{const r=split(k);if(r.length)sec.push({t,rows:r})});
  return{kpis,sec};
}
function renderStats(){
  const m=buildStats();
  $('pdfBtn').disabled=!m;
  if(!m){$('stats').innerHTML='<div class="empty">Trag deinen ersten Fang oder Angeltag ein, dann erscheint hier die Auswertung.</div>';return}
  $('stats').innerHTML=`<div class="stats">${m.kpis.map(([v,l])=>`<div class="stat"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('')}</div>
  <div class="cols">${m.sec.map(x=>`<div><h3>${esc(x.t)}</h3>${bars(x.rows,'')}</div>`).join('')}</div>`;
}
async function exportPdf(){
  const m=buildStats(); if(!m)return toast('Noch keine Daten für die Auswertung');
  if(!window.jspdf)return toast('PDF-Bibliothek nicht geladen – Internetverbindung prüfen');
  const t=x=>String(x).replace(/[–—]/g,'-');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const M=16,R=194; let y=M;
  const need=h=>{if(y+h>284){doc.addPage();y=M}};
  doc.setFont('helvetica','bold');doc.setFontSize(20);doc.setTextColor(16,41,43);doc.text('Fangtagebuch - Auswertung',M,y+6);y+=12;
  const ds=data.map(e=>e.datum).sort();
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(90);
  doc.text(`Zeitraum ${dDE(ds[0])} bis ${dDE(ds[ds.length-1])} · erstellt am ${dDE(today())}`,M,y);y+=9;
  const cw=(R-M)/4;
  m.kpis.forEach(([v,l],i)=>{
    const x=M+(i%4)*cw, yy=y+Math.floor(i/4)*17;
    doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(16,41,43);doc.text(t(v),x,yy+5);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(90);doc.text(doc.splitTextToSize(t(l),cw-3),x,yy+10);
  });
  y+=Math.ceil(m.kpis.length/4)*17+4;
  m.sec.forEach(x=>{
    need(18);
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(16,41,43);doc.text(t(x.t),M,y);y+=6;
    const max=Math.max(...x.rows.map(r=>r.v),1);
    x.rows.forEach(r=>{
      need(6);
      doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(30);
      doc.text(doc.splitTextToSize(t(r.l),42)[0],M,y);
      doc.setFillColor(156,195,198);doc.rect(M+46,y-3,Math.max(r.v/max*70,0.6),3.5,'F');
      doc.setTextColor(90);doc.text(t(r.txt),M+46+72,y);
      y+=5.5;
    });
    y+=5;
  });
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`Seite ${i} von ${pages}`,R,290,{align:'right'})}
  await download(`fangtagebuch-auswertung-${today()}.pdf`,doc.output('blob'),'application/pdf');
}
$('pdfBtn').onclick=exportPdf;
async function exportListPdf(){
  const l=sorted(); if(!l.length)return toast('Noch keine Einträge');
  if(!window.jspdf)return toast('PDF-Bibliothek nicht geladen – Internetverbindung prüfen');
  const t=x=>String(x??'').replace(/[–—]/g,'-');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'landscape'});
  const M=14,R=283,cols=[['Datum',14,22],['Zeit',36,12],['Fisch',48,30],['Länge',78,16],['Köder',94,32],['Gewässer',126,36],['Details',162,R-162]];
  let y=M;
  const head=()=>{
    doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(16,41,43);
    cols.forEach(([n,x])=>doc.text(n,x,y));
    doc.setDrawColor(150);doc.line(M,y+1.8,R,y+1.8);y+=6;
  };
  doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(16,41,43);doc.text('Fangtagebuch - Fänge',M,y+5);y+=11;
  const nf=l.filter(e=>!e.kein).length;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(90);
  doc.text(`${l.length} Einträge · ${nf} Fänge · ${l.length-nf} Tage ohne Fang · erstellt am ${dDE(today())}`,M,y);y+=8;
  head();
  l.forEach(e=>{
    const det=[wl(e.methode).join(', '),wl(e.wetter).join(', '),e.wtemp!=null?e.wtemp+' °C Wasser':'',e.kein?'':(e.gewicht?fmt(e.gewicht,2)+' kg':''),e.kein?'':(e.frei?'zurückgesetzt':'entnommen'),e.notiz].filter(Boolean).join(' · ');
    const cells=[dDE(e.datum),e.zeit,e.kein?'Kein Fang':e.fisch,e.kein?'-':fmt(e.laenge)+' cm',wl(e.koeder).join(', '),wl(e.gewaesser).join(', '),det];
    doc.setFont('helvetica','normal');doc.setFontSize(8.5);
    const lines=cells.map((c,i)=>doc.splitTextToSize(t(c),cols[i][2]-2));
    const h=Math.max(...lines.map(x=>x.length))*3.8+2.2;
    if(y+h>196){doc.addPage();y=M;head()}
    doc.setTextColor(e.kein?120:30);
    lines.forEach((ln,i)=>doc.text(ln,cols[i][1],y));
    doc.setDrawColor(215);doc.line(M,y+h-3,R,y+h-3);
    y+=h;
  });
  const pages=doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(120);doc.text(`Seite ${i} von ${pages}`,R,205,{align:'right'})}
  await download(`fangtagebuch-faenge-${today()}.pdf`,doc.output('blob'),'application/pdf');
}
$('listPdfBtn').onclick=exportListPdf;
function renderList(){
  const l=sorted();
  $('listPdfBtn').disabled=!l.length;
  $('list').innerHTML=l.length?l.map(e=>{
    const meta=[dDE(e.datum)+', '+e.zeit+' Uhr',wl(e.koeder).length?(e.kein?'Versucht mit: ':'Köder: ')+wl(e.koeder).join(', '):'',wl(e.gewaesser).join(', '),wl(e.methode).join(', '),wl(e.wetter).join(', '),
      e.wtemp!=null?e.wtemp+' °C Wasser':'',e.kein?'':(e.gewicht?fmt(e.gewicht,2)+' kg':''),e.kein?'':(e.frei?'zurückgesetzt':'entnommen')].filter(Boolean).map(esc).join(' · ');
    return `<div class="entry"><strong>${e.kein?'Kein Fang':esc(e.fisch)}</strong><span class="len">${e.kein?'–':fmt(e.laenge)+' cm'}</span>
      <div class="meta">${meta}${e.notiz?'<br>'+esc(e.notiz):''}</div>
      <div class="act"><button data-e="${e.id}">Bearbeiten</button><button data-d="${e.id}">Löschen</button></div></div>`}).join('')
    :'<div class="empty">Noch keine Fänge eingetragen.</div>';
}
$('list').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.e)edit(b.dataset.e); if(b.dataset.d)del(b.dataset.d);
});
function render(){opts();renderStats();renderList()}

async function download(name,text,type){
  if(typeof claude!=='undefined'&&claude.use){
    try{
      const d=await claude.use('downloads');
      if(!d){toast('Speichern ist hier nicht verfügbar');return}
      await d.save({filename:name,data:text});toast('Datei gespeichert');
    }catch(e){if(!e||e.code!=='declined')toast('Speichern nicht möglich')}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('expJson').onclick=()=>{if(!data.length)return toast('Noch nichts zu sichern');download(`fangtagebuch-${today()}.json`,JSON.stringify(data,null,1),'application/json')};
$('expCsv').onclick=()=>{
  if(!data.length)return toast('Noch nichts zu exportieren');
  const h=['Datum','Uhrzeit','Fisch','Länge cm','Gewicht kg','Köder','Gewässer','Methode','Wetter','Wassertemp °C','Zurückgesetzt','Kein Fang','Notiz'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=sorted().map(e=>[e.datum,e.zeit,e.fisch,e.laenge,e.gewicht,wl(e.koeder).join(', '),wl(e.gewaesser).join(', '),wl(e.methode).join(', '),wl(e.wetter).join(', '),e.wtemp,e.kein?'':(e.frei?'ja':'nein'),e.kein?'ja':'nein',e.notiz].map(q).join(';'));
  download(`fangtagebuch-${today()}.csv`,'\uFEFF'+[h.map(q).join(';'),...rows].join('\n'),'text/csv');
};
$('impBtn').onclick=()=>$('impFile').click();
$('impFile').onchange=ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const arr=JSON.parse(r.result);
      if(!Array.isArray(arr)||arr.some(e=>!e||!e.datum||(!e.fisch&&!e.kein)))throw 0;
      const ids=new Set(data.map(e=>e.id));let add=0;
      arr.forEach(e=>{if(!e.id||!ids.has(e.id)){e.id=e.id||Date.now().toString(36)+add;data.push(e);add++}});
      save();render();toast(add+' Einträge geladen');
    }catch(e){toast('Datei nicht lesbar')}
    $('impFile').value='';
  };
  r.readAsText(f);
};

resetForm();render();
</script>
